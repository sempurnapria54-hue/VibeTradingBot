spring:
  datasource:
    url: jdbc:postgresql://db:5432/vibe_trading_bot
    username: vibe_trading_bot
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}
app:
  indicators:
    warmupBars:
      EMA: 100
      MACD: 100
      RSI: 100
      STOCH: 100
      BB: 100
      OBV: 100
    batchFlushBars: 200
    numeric:
      priceScale: 30
      mathRounding: HALF_UP
