spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vibe_trading_bot
    username: postgres
    password: postgres
  flyway:
    enabled: true
logging:
  level:
    com.example.vibetradingbot: DEBUG
security:
  jwt:
    secret: dev-secret-please-change
app:
  indicators:
    warmupBars:
      EMA: 100
      MACD: 100
      RSI: 100
      STOCH: 100
      BB: 100
      OBV: 100
    batchFlushBars: 200
    numeric:
      priceScale: 30
      mathRounding: HALF_UP
