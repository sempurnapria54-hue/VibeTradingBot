server:
  port: 8080

spring:
  application:
    name: trading-bot
  jooq:
    sql-dialect: POSTGRES
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example.tradingbot: INFO

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
  paths-to-match: /api/**, /auth/**

security:
  jwt:
    issuer: trading-bot
    access-token-ttl: PT15M
    refresh-token-ttl: P14D
    public-key: ${JWT_PUBLIC_KEY:}
    private-key: ${JWT_PRIVATE_KEY:}

app:
  exchanges:
    required: ["okx"]

timeframes:
  canonical:
    - "1 minute"
    - "3 minutes"
    - "5 minutes"
    - "15 minutes"
    - "1 hour"
    - "2 hours"
    - "4 hours"
    - "1 day"
  exchanges:
    okx:
      "1 minute": "1m"
      "3 minutes": "3m"
      "5 minutes": "5m"
      "15 minutes": "15m"
      "1 hour": "1H"
      "2 hours": "2H"
      "4 hours": "4H"
      "1 day": "1D"
