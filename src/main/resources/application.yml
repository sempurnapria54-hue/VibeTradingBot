spring:
  application:
    name: vibe-trading-bot
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vibe_trading_bot}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
  jooq:
    sql-dialect: POSTGRES
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
server:
  port: 8080
logging:
  level:
    com.example.vibetradingbot: INFO
security:
  jwt:
    issuer: vibe-trading-bot
    secret: ${SECURITY_JWT_SECRET:dev-secret-please-change}
    access-token-ttl: PT15M
    refresh-token-ttl: P14D
canonical-timeframes:
  resource: classpath:timeframes/canonical-timeframes.yaml
decimal:
  scale: 8
  precision: 30
  rounding-mode: HALF_UP
app:
  history:
    batchLimit: 200
    requestTimeoutMs: 10000
    maxRetries: 3
    retryBackoffMs: 500
    pageDelayMs: 250
    rateLimitPerSecond: 4
  consistency:
    scanWindowBars: 5000
    refillChunkBars: 1000
  indicators:
    warmupBars:
      EMA: 100
      MACD: 100
      RSI: 100
      STOCH: 100
      BB: 100
      OBV: 100
    batchFlushBars: 200
    numeric:
      priceScale: 30
      mathRounding: HALF_UP
  signals:
    debounceBars: 2
    cooldownBars: 5
    htfFilter:
      enabled: true
      htf: "4 hours"
    numeric:
      scoreScale: 6
      rounding: HALF_UP
  quorum:
    debounceBars: 1
    cooldownBars: 0
    numeric:
      scoreScale: 6
      rounding: HALF_UP
  backtest:
    latencyBars: 1
    slippageBps: 1.5
    takerFeeBps: 5.0
    fundingBpsPer8h: 0.8
    horizons:
      bars: [1, 3, 5, 10]
      volAtr: [1.0, 1.5, 2.0]
      tripleBarrier:
        tpKatr: 1.5
        slKatr: 1.0
        timeBars: 5
    trailing:
      enabled: true
      atrPeriod: 14
      trailKatr: 1.0
      breakevenAtR: 1.0
    position:
      leverageMax: 10
      isolated: true
      riskPerTradePct: 1.0
